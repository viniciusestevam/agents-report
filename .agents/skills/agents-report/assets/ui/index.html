<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents Report</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23b8572f' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23b8572f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">

<div class="shell">
