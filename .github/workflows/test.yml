name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Skill runs isolated from the repository
        run: |
          python skills/agents-report/scripts/agents_report.py package --out /tmp/agents-report.zip
          mkdir -p /tmp/skill && unzip -q /tmp/agents-report.zip -d /tmp/skill
          cd /tmp && python -I /tmp/skill/agents-report/scripts/agents_report.py doctor
