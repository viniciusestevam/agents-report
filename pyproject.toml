[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agents-report"
dynamic = ["version"]
description = "See what your AI coding agents cost, and why: spend, session traces, context window and recommendations for Claude Code, Codex, Hermes, Pi and OpenCode. Local only."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vinicius Estevam" }]
keywords = ["ai-agents", "observability", "claude-code", "codex", "tokens", "prompt-cache", "llm-cost"]
classifiers = [
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []  # standard library only

[project.urls]
Homepage = "https://github.com/viniciusestevam/agents-report"
Issues = "https://github.com/viniciusestevam/agents-report/issues"

[project.scripts]
agents-report = "agentobs.cli:main"

# The package is the skill's own code; the dashboard files ride along inside it.
[tool.hatch.version]
path = ".agents/skills/agents-report/scripts/agentobs/__init__.py"

[tool.hatch.build.targets.wheel]
packages = [".agents/skills/agents-report/scripts/agentobs"]

[tool.hatch.build.targets.wheel.force-include]
".agents/skills/agents-report/assets/ui" = "agentobs/ui"

[tool.hatch.build.targets.sdist]
include = [".agents/skills/agents-report", "README.md", "LICENSE", "pyproject.toml"]
